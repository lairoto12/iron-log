<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Log</title>
<meta name="description" content="Private gym log with an on-device AI coach.">
<meta name="theme-color" content="#0e1319">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app — header, scrolling content, bottom tab bar. Steel ground, chalk-amber accent. Dark-first. */
:root{
  --bg:#0e1319; --surface:#171f29; --surface2:#212b37; --fg:#e7ecf1; --muted:#8e9aa9; --line:#2a3543;
  --accent:#f0b443; --accent-ink:#1a1206; --accent-soft:#3a2d14;
  --ok:#4cc27e; --warn:#ef7b52; --mp:#6aa3ef; --mc:#3cc2b1; --mf:#d585c2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#e2e7ed; --fg:#131a23; --muted:#5b6674; --line:#d2d9e1;
  --accent:#b8740a; --accent-ink:#ffffff; --accent-soft:#f6e7cc;
  --ok:#2d8a52; --warn:#b4471f; --mp:#2f6fc4; --mc:#16897c; --mf:#a24d8c; color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{padding-block:14px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:2px 0 0;letter-spacing:.01em;text-transform:uppercase}
h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
main{flex:1;overflow-y:auto;padding-block:4px 20px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:10px}
.tab svg,.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.gear{border:0;background:var(--surface2);color:var(--muted);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.gear[aria-current="page"]{color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 14px;font-weight:600;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--warn)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:20px;line-height:1}
.icon-btn:hover{background:var(--surface2)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px;width:100%;min-width:0;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:380px){.grid4{grid-template-columns:1fr 1fr}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wd .d{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.wd .n{font-family:var(--display);font-size:20px;font-weight:600;line-height:1}
.wd .s{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:2px}
.wd .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.wd.done .dot{background:var(--ok)}
.wd.today .n{color:var(--accent)}
.wd[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.daytag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.ex{display:flex;flex-direction:column;gap:7px;padding-block:10px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0;padding-top:0}
.exname{font-weight:600}
.sets{display:flex;flex-wrap:wrap;gap:6px}
.set{min-width:44px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:600;color:var(--muted)}
.set[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.cal{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:120px;height:120px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.macros{display:flex;flex-direction:column;gap:10px;min-width:0}
.mac .row{font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.food{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding-block:9px;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.food .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.food .mx{font-size:12px;color:var(--muted)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.split-ex{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding-block:5px;border-top:1px dashed var(--line)}
.split-ex:first-child{border-top:0}
.edrow{display:grid;grid-template-columns:1fr 58px 78px 36px;gap:6px;align-items:center}
.edrow input{padding:8px;min-height:38px;font-size:15px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.coach{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:140px}
.spark{width:100%;height:70px;display:block}
.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;text-align:center}
.note{font-size:13px;color:var(--muted)}
.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rec div{background:var(--surface2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rec .k{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.rec .v{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.rec .hl{background:var(--accent-soft)}
.rec .hl .v{color:var(--accent)}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ai{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding-block:6px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
@media (prefers-reduced-motion:no-preference){.ring circle.v,.bar i{transition:stroke-dashoffset .5s ease,width .5s ease}}
</style>
</head>
<body>
<div id="app">
  <header class="top wrap">
    <div><div class="eyebrow" id="hdrDate"></div><h1 id="hdrTitle">Today</h1></div>
    <button class="gear" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="main" class="wrap"></main>
  <nav class="tabs wrap" aria-label="Sections">
    <button class="tab" data-tab="today"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"/></svg>Today</button>
    <button class="tab" data-tab="food"><svg viewBox="0 0 24 24"><path d="M12 3c-4 4-6 7-6 10a6 6 0 0 0 12 0c0-3-2-6-6-10z"/></svg>Food</button>
    <button class="tab" data-tab="split"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Split</button>
    <button class="tab" data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/></svg>Goals</button>
    <button class="tab" data-tab="coach"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>Coach</button>
  </nav>
</div>
<input id="importIn" type="file" accept="application/json,.json" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
